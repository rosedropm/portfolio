          },
          "description": "建立後盡量不要修改，避免舊連結失效。"
        },
        {
          "name": "short_title",
          "label": "列表顯示名稱",
          "type": "string",
          "required": true
        },
        {
          "name": "title",
          "label": "頁面大標題",
          "type": "text",
          "required": true
        },
        {
          "name": "summary",
          "label": "作品簡介",
          "type": "text",
          "required": true
        },
        {
          "name": "category",
          "label": "作品分類",
          "type": "select",
          "required": true,
          "options": {
            "values": [
              "文字文案",
              "社群圖文",
              "短影音",
              "AI 協作"
            ]
          }
        },
        {
          "name": "published",
          "label": "顯示在網站上",
          "type": "boolean",
          "description": "關閉後不發布此作品。公開 GitHub 儲存庫中的內容檔仍可被讀取。"
        },
        {
          "name": "order",
