            },
            {
              "name": "caption",
              "label": "圖片下方說明（選填）",
              "type": "text"
            },
            {
              "name": "video_url",
              "label": "YouTube 網址（選填，可貼 Shorts）",
              "type": "string"
            },
            {
              "name": "orientation",
              "label": "影片比例",
              "type": "select",
              "options": {
                "values": [
                  {
                    "value": "portrait",
                    "label": "直式 9:16"
                  },
                  {
                    "value": "landscape",
                    "label": "橫式 16:9"
                  }
                ]
              }
            }
          ]
        },
        {
          "name": "sections",
          "label": "舊版｜文章段落",
          "type": "object",
          "fields": [
            {
              "name": "title",
              "label": "段落標題",
              "type": "string",
              "required": true
            },
            {
              "name": "text",
              "label": "內文",
              "type": "text",
              "description": "直接輸入文字。空一行會分成新段落；不需要 HTML 或 Markdown。"
            }
          ],
          "list": {
            "collapsible": {
              "collapsed": true,
              "summary": "{title}"
            }
          },
          "description": "未填新版圖文內容區塊時使用。原有作品可繼續使用；新版作品請將內容填在上方圖文內容區塊。"
        },
        {
          "name": "gallery",
          "label": "舊版｜作品圖片／相簿",
          "type": "object",
          "fields": [
            {
              "name": "image",
              "label": "圖片",
