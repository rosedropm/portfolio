    {
      "name": "photography",
      "label": "攝影相簿",
      "type": "collection",
      "path": "content/photography",
      "format": "json",
      "filename": "{fields.slug}.json",
      "subfolders": false,
      "view": {
        "primary": "short_title",
        "fields": [
          "short_title",
          "category",
          "published",
          "order"
        ],
        "sort": [
          "order",
          "short_title"
        ],
        "default": {
          "sort": "order",
          "order": "asc"
        }
      },
      "fields": [
        {
          "name": "slug",
          "label": "網址代稱",
          "type": "string",
          "required": true,
          "pattern": {
            "regex": "^[a-z0-9]+(?:-[a-z0-9]+)*$",
            "message": "請使用小寫英文、數字及連字號，例如 summer-campaign。"
          },
          "description": "建立後盡量不要修改，避免舊連結失效。"
        },
        {
          "name": "short_title",
          "label": "列表顯示名稱",
          "type": "string",
