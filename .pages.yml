          "description": "專案與內容作品：按排列順序選取前 3 筆勾選的作品。"
        },
        {
          "name": "period",
          "label": "期間／作品性質",
          "type": "string"
        },
        {
          "name": "role",
          "label": "我的角色",
          "type": "string",
          "required": true
        },
        {
          "name": "cover",
          "label": "封面圖片",
          "type": "image"
        },
        {
          "name": "cover_alt",
          "label": "封面圖片描述",
          "type": "string"
        },
        {
          "name": "quote",
          "label": "無圖片時的文字封面",
          "type": "text"
        },
        {
          "name": "blocks",
          "label": "圖文內容區塊（新版，可排序）",
          "type": "object",
          "list": true,
          "description": "新增作品請在這裡依閱讀順序加入區塊。每個區塊可填文字、圖片或 YouTube，未使用的欄位留空；區塊內依文字→圖片→影片顯示。填入有效區塊後，舊版段落、相簿與影片區不會顯示；資料仍保留。清空所有區塊可恢復舊版。",
          "fields": [
            {
              "name": "title",
              "label": "區塊標題（選填）",
